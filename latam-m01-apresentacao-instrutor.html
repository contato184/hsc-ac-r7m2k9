:root{
  --navy:#011072; --navy-2:#000B4A; --night:#06091F; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#E0A526; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#011072; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido - HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

html,body{height:100%;overflow:hidden;background:var(--night)}
.top{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(90deg,var(--navy-2),var(--navy));color:#fff;z-index:20;font-size:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.top .logo{height:20px;display:block}
.top .sep{width:1px;height:22px;background:rgba(255,255,255,.25)}
.top .acad{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.course{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;font-size:13.5px}
.badge{font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;white-space:nowrap;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.tb{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.12)}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
#timer{font-variant-numeric:tabular-nums}
.wrap{position:fixed;inset:52px 0 54px 0;display:flex;align-items:center;justify-content:center;padding:14px;transition:right .2s}
.wrap.with-side{right:390px}
.stage{position:relative;aspect-ratio:16/9;width:min(100%, calc((100vh - 134px) * 16/9));background:#fff;border-radius:8px;
  box-shadow:0 14px 50px rgba(0,0,0,.55);overflow:hidden}
#vp{position:absolute;left:0;top:0;width:1280px;height:720px;container-type:inline-size;transform-origin:0 0;transform:scale(var(--k,1))}
.slide{position:absolute;inset:0;display:none}
.slide.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slide{background-size:cover;background-position:center}
.pe{position:absolute;box-sizing:border-box;margin:0}
.tx{display:flex;flex-direction:column;line-height:1.2;overflow-wrap:break-word}
.tx p{margin:0;white-space:pre-wrap}
img.pe{object-fit:fill;pointer-events:none}
table.tb{border-collapse:collapse;table-layout:fixed;line-height:1.2}
table.tb td p{margin:0;white-space:pre-wrap}
.stage .hot{color:inherit;font-weight:inherit;border-bottom:none;cursor:pointer;border-radius:.3cqw;transition:background .15s}
.stage.show-hot .hot{background:rgba(74,108,247,.13);box-shadow:0 0 0 .25cqw rgba(74,108,247,.13);text-decoration:underline dashed rgba(74,108,247,.9);text-underline-offset:.35cqw}
.stage.show-hot .hot::after{content:"↗";font-size:.75em;margin-left:.15em;color:var(--accent);font-weight:700}
.stage .hot:hover{background:rgba(74,108,247,.28)}
.th .mini{position:absolute;left:0;top:0;width:1000px;height:562.5px;container-type:inline-size;pointer-events:none;transform-origin:0 0;transform:scale(var(--s,.2))}
.th .mini .slide{display:block}
.th .mini .hot::after{content:none}
.swm{position:absolute;right:5.5%;bottom:1.7%;font-size:.62cqw;line-height:1;letter-spacing:.02em;color:rgba(110,116,128,.8);white-space:nowrap;pointer-events:none;user-select:none}
.swm.dk{color:rgba(255,255,255,.55)}
/* chip de exercício sobre o slide */
.exchips{position:absolute;right:1.6cqw;top:1.6cqw;display:flex;gap:.8cqw;z-index:3}
.exchip{background:var(--navy);color:#fff;border:0;border-radius:3cqw;padding:.7cqw 1.4cqw;font-size:max(11px,1.15cqw);font-weight:600;cursor:pointer;
  box-shadow:0 .5cqw 1.5cqw rgba(1,16,114,.35);display:flex;align-items:center;gap:.6cqw}
.exchip:hover{background:var(--accent)}
.exchip i{font-style:normal;background:var(--accent);border-radius:2cqw;padding:.1cqw .6cqw}
.bottom{position:fixed;inset:auto 0 0 0;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--navy-2);color:#fff;z-index:20;font-size:13px;border-top:1px solid rgba(255,255,255,.08)}
.progress{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;min-width:40px;position:relative}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width .2s}
.progress b{position:absolute;left:0;top:0;bottom:0;background:rgba(74,108,247,.35);width:0}
#count{font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
#code{opacity:.6;white-space:nowrap;font-size:12px}
.has-bar .bottom{padding-right:var(--wmw,420px)}
@media (max-width:700px){ .has-bar .bottom{padding-right:14px;bottom:30px} .has-bar .wm{bottom:4px;font-size:10px} }
.side{position:fixed;top:52px;bottom:54px;right:0;width:390px;background:var(--panel);color:var(--panel-ink);z-index:15;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column}
.side.open{transform:none}
.side header{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
.side header button{flex:1;background:transparent;color:var(--panel-ink);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:7px 4px;cursor:pointer;font-size:12.5px}
.side header button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sbody{padding:14px 16px;overflow:auto;font-size:15px;line-height:1.6;flex:1}
.sbody h4{margin:16px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-weight:600}
.sbody h4:first-child{margin-top:0}
.sbody p{margin:0 0 10px}
.sbody .hot{color:#9DB1FF}
.sbody .ref{background:rgba(255,255,255,.06)}
.sbody textarea{width:100%;min-height:220px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;padding:10px;font-size:14px;line-height:1.5}
.filter{width:100%;padding:8px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;margin-bottom:10px;font-size:13px}
.exitem{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;background:rgba(255,255,255,.06);margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.exitem:hover{border-color:var(--accent)}
.exitem b{background:var(--accent);border-radius:6px;padding:4px 7px;font-size:12px}
.exitem small{display:block;opacity:.7;font-size:12px}
.grid{position:fixed;inset:52px 0 54px 0;background:rgba(3,6,30,.97);z-index:18;display:none;overflow:auto;padding:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;align-content:start}
.grid.open{display:grid}
.th{position:relative;cursor:pointer;border:3px solid transparent;border-radius:6px;overflow:hidden;background:#fff;aspect-ratio:16/9}
.th.cur{border-color:var(--accent)}
.th .num{position:absolute;left:6px;bottom:6px;background:rgba(1,16,114,.88);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.th.seen::after{content:"✓";position:absolute;right:6px;top:6px;background:var(--ok);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;text-align:center}
@media (max-width:980px){ .course,#code,.acad,.sep{display:none} }
@media (max-width:900px){ .side{width:100%} .wrap.with-side{right:0} }
</style>

ão 1.2, Classificação comparada.\nFontes: RIS arts. 83 e 179 (Drive: wo88318.html, RIS com reforma de 31/05/2021); Guía COFEPRIS para la obtención del Registro Sanitario de DM, itens 7.3, 7.4, 2.12, 2.13 e cap. 5. Decreto de reforma do RIS, DOF 24/04/2026, arts. 190 Bis 3 e 190 Bis 7 e Transitorio Primero (vigência no dia seguinte à publicação).", "refs": [], "notaRefs": ["cofepris", "dof"], "ex": []}, {"bg": "background:#FFFFFF", "html": "<div class=\"pe tx\" style=\"left:5.000%;top:5.694%;width:90.000%;min-height:3.056%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.250cqw;letter-spacing:0.278cqw;color:#4A6CF7;font-weight:600\">BLOCO 1.2: CLASSIFICAÇÃO</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:10.000%;width:90.000%;min-height:6.944%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:3.047cqw;color:#011072;font-weight:700\">Colômbia: registro automático e avaliação</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:86.239%;width:90.000%;min-height:4.733%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.109cqw;color:#6E7480;font-weight:400\">Fonte: <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> arts. 6 b e d, 7, 16, 17, 22 b, 31, 32 e 46; art. 21, parágrafo 2º, na redação do <a class=\"hot\" data-refs=\"invima\">Decreto 582/2017</a>, art. 1º, e considerandos do <a class=\"hot\" data-refs=\"invima\">Decreto 582/2017</a></span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:92.500%;width:25.000%;min-height:2.778%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.109cqw;color:#6E7480;font-weight:400\">HSC-LATAM-M01 Rev. 00, Encontro 1    12</span></p></div><div class=\"pe tx\" style=\"left:30.000%;top:92.639%;width:52.031%;min-height:2.778%;background:trans  e o importador precisa do CCAA. No Peru, só laboratório ou droguería autorizada pode pedir o registro.\nMaterial do aluno: Apostila do Aluno, seção 1.3, Titular do registro.\nFontes: Res. GMC 25/21 Ap. I def. 4 e Ap. III 2.1; Guía COFEPRIS checklists 1.2, 1.4 e 1.9; Decreto 4725/2005 arts. 2, 10, 20 e 29 d; DS 825/1998 art. 3; ChileAtiende ficha 14538. DS 016-2011-SA art. 8; RDC 751/2022 art. 4º, VIII (a exigência de AFE vem da Lei 6.360/1976, não da RDC 751).", "refs": [], "notaRefs": ["anvisa", "cofepris", "mercosur", "invima", "digemid", "bcn"], "ex": []}, {"bg": "background:#FFFFFF", "html": "<div class=\"pe tx\" style=\"left:5.000%;top:5.694%;width:90.000%;min-height:3.056%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.250cqw;letter-spacing:0.278cqw;color:#4A6CF7;font-weight:600\">BLOCO 1.3: TITULAR</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:10.000%;width:90.000%;min-height:6.944%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:3.047cqw;color:#011072;font-weight:700\">O titular não é só um endereço</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:86.239%;width:90.000%;min-height:4.733%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.109cqw;color:#6E7480;font-weight:400\">Fonte: <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> arts. 21 c, 29 d e 59 a 63; <a class=\"hot\" data-refs=\"bcn\">DS 825/1998</a> art. 28; <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> Parte 3 item 6.c. <a class=\"hot\" data-refs=\"dof\">RIS</a> art. 190 e <a class=\"hot\" data-refs=\"cofepris\">Guía de Modificaciones COFEPRIS</a> (dez/2025), p. 22, homoclave <a class=\"hot\" data-refs=\"cofepris\">COFEPRIS-2022-022-003</a>: cessão notificada em 30 dias úteis, com contrato protocolizado em cartório</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:92.500%;width:25.000%;min-height:2.778%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.109cqw;color:#6E7480;font-weight:400\">HSC-LATAM-M01 Rev. 00, Encontro 1    16</span></p></div><div class=\"pe tx\" style=\"left:30.000%;top:92.639%;width:52.031%;min-height:2.778%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"text-align:right\"><span style=\"font-size:1.039cqw;color:#011072;font-weight:400\">Uso exclusivo HSC Global Group. Reprodução proibida. Direitos reservados, registro INPI.</span></p></div><img class=\"pe\" data-img=\"logoNavy\" style=\"left:83.516%;top:91.944%;width:11.016%;height:2.917%\" alt=\"\"><div class=\"pe tx box\" style=\"left:5.000%;top:23.056%;width:28.542%;height:29.167%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:6.875%;top:26.111%;width:24.792%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.797cqw;color:#011072;font-weight:700\">Habilitação vigente</span></p></div><div class=\"pe tx\" style=\"left:6.875%;top:31.611%;width:24.792%;min-height:10.500%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.641cqw;color:#171717;font-weight:400\">AFE, estabelecimento habilitado, CCAA ou aviso de funcionamiento</span></p></div><div class=\"pe tx box\" style=\"left:35.729%;top:23.056%;width:28.542%;height:29.167%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:37.604%;top:26.111%;width:24.792%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.797cqw;color:#011072;font-weight:700\">Resposta à autoridade</span></p></div><div class=\"pe tx\" style=\"left:37.604%;top:31.611%;width:24.792%;min-height:10.500%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.641cqw;color:#171717;font-weight:400\">Exigências no prazo; na Colômbia, 90 dias para complementar (art. 21 c)</span></p></div><div class=\"pe tx box\" style=\"left:66.458%;top:23.056%;width:28.542%;height:29.167%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:68.333%;top:26.111%;width:24.792%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.797cqw;color:#011072;font-weight:700\">Tecnovigilância e recall</span></p></div><div class=\"pe tx\" style=\"left:68.333%;top:31.611%;width:24.792%;min-height:10.500%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.641cqw;color:#171717;font-weight:400\">Notificar incidentes e ações de campo (Colômbia arts. 59-63; Chile <a class=\"hot\" data-refs=\"bcn\">DS 825</a> art. 28)</span></p></div><div class=\"pe tx box\" style=\"left:5.000%;top:55.556%;width:28.542%;height:29.167%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:6.875%;top:58.611%;width:24.792%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.797cqw;color:#011072;font-weight:700\">Carta do fabricante</span></p></div><div class=\"pe tx\" style=\"left:6.875%;top:64.111%;width:24.792%;min-height:10.500%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.641cqw;color:#171717;font-weight:400\">Documento que faculta o titular (Colômbia art. 29 d; RTM Parte 3, 6.c)</span></p></div><div class=\"pe tx box\" style=\"left:35.729%;top:55.556%;width:28.542%;height:29.167%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:37.604%;top:58.611%;width:24.792%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.797cqw;color:#011072;font-weight:700\">Transferência do registro</span></p></div><div class=\"pe tx\" style=\"left:37.604%;top:64.111%;width:24.792%;min-height:14.000%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.641cqw;color:#171717;font-weight:400\">Cláusula no contrato; no México, cessão notificada em até 30 dias úteis (<a class=\"hot\" data-refs=\"dof\">RIS</a>, art. 190)</span></p></div><div class=\"pe tx box\" style=\"left:66.458%;top:55.556%;width:28.542%;height:29.167%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:68.333%;top:58.611%;width:24.792%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.797cqw;color:#011072;font-weight:700\">Independência</span></p></div><div class=\"pe tx\" style=\"left:68.333%;top:64.111%;width:24.792%;min-height:7.000%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.641cqw;color:#171717;font-weight:400\">Trocar de distribuidor sem perder o registro</span></p></div>", "notas": "Escolher o titular é uma decisão comercial e regulatória ao mesmo tempo. Ele precisa estar habilitado, responder exigências no prazo e cuidar de tecnovigilância e ações de campo. Ele também depende de uma carta do fabricante que o faculta. E trocar de titular depois costuma exigir transferência formal: no México, por exemplo, a cessão tem de ser comunicada em até 30 dias úteis. Por isso, o contrato com o titular precisa prever a transferência do registro se a relação terminar.\nMaterial do aluno: Apostila do Aluno, seção 1.3, Titular do registro.\nFontes: Decreto 4725/2005 arts. 21 c, 29 d e 59 a 63; DS 825/1998 art. 28; Res. GMC 25/21 Parte 3 item 6.c. RIS art. 190 e Guía de Modificaciones COFEPRIS (dez/2025), p. 22, homoclave COFEPRIS-2022-022-003: cessão notificada em 30 dias úteis, com contrato protocolizado em cartório.", "refs": [], "notaRefs": ["cofepris", "dof", "mercosur", "invima", "bcn"], "ex": []}, {"bg": "background:#FFFFFF", "html": "<div class=\"pe tx\" style=\"left:5.000%;top:5.694%;width:90.000%;min-height:3.056%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.250cqw;letter-spacing:0.278cqw;color:#4A6CF7;font-weight:600\">BLOCO 1.3: DISCUSSÃO</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:10.000%;width:90.000%;min-height:6.944%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:3.047cqw;color:#011072;font-weight:700\">Pergunta para a turma</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:88.606%;width:90.000%;min-height:2.367%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.109cqw;color:#6E7480;font-weight:400\">Fonte: <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a>, arts. 10 e 20; <a class=\"hot\" data-refs=\"dof\">RIS</a>, art. 190, e <a class=\"hot\" data-refs=\"cofepris\">Guía de Modificaciones COFEPRIS</a>, homoclave <a class=\"hot\" data-refs=\"cofepris\">COFEPRIS-2022-022-003</a>; <a class=\"hot\" data-refs=\"digemid\">DS 016-2011-SA</a>, art. 8</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:92.500%;width:25.000%;min-height:2.778%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.109cqw;color:#6E7480;font-weight:400\">HSC-LATAM-M01 Rev. 00, Encontro 1    17</span></p></div><div class=\"pe tx\" style=\"left:30.000%;top:92.639%;width:52.031%;min-height:2.778%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"text-align:right\"><span style=\"font-size:1.039cqw;color:#011072;font-weight:400\">Uso exclusivo HSC Global Group. Reprodução proibida. Direitos reservados, registro INPI.</span></p></div><img class=\"pe\" data-img=\"logoNavy\" style=\"left:83.516%;top:91.944%;width:11.016%;height:2.917%\" alt=\"\"><div class=\"pe tx box\" style=\"left:5.000%;top:23.056%;width:90.000%;height:18.056%;background:#011072;border:0.117cqw solid #011072;border-radius:0.781cqw\"></div><div class=\"pe tx\" style=\"left:8.750%;top:23.056%;width:82.500%;height:18.056%;background:transparent;padding:0;justify-content:center;color:#171717;\"><p style=\"\"><span style=\"font-size:2.344cqw;color:#FFFFFF;font-weight:700\">Em quais países você manteria o titular independente do distribuidor? Por quê?</span></p></div><div class=\"pe tx box\" style=\"left:5.000%;top:45.278%;width:43.906%;height:33.889%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:6.875%;top:48.333%;width:40.156%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.797cqw;color:#011072;font-weight:700\">Titular = distribuidor</span></p></div><div class=\"pe tx\" style=\"left:6.875%;top:53.833%;width:40.156%;min-height:8.000%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.875cqw;color:#171717;font-weight:400\">Trocar de distribuidor pode significar perder o registro</span></p></div><div class=\"pe tx box\" style=\"left:51.094%;top:45.278%;width:43.906%;height:33.889%;background:#F0F2FF;border:0.117cqw solid #F0F2FF;border-radius:0.625cqw\"></div><div class=\"pe tx\" style=\"left:52.969%;top:48.333%;width:40.156%;min-height:3.833%;background:transparent;padding:0;justify-content:flex-start;color:#17 <span style=\"font-size:1.641cqw;color:#171717;font-weight:400\">Simplificação, não reliance</span></p></td></tr></table>", "notas": "Entre os cinco países, só o México tem rota de reliance confirmada para dispositivos médicos, e a própria COFEPRIS publica uma guia de requisitos para acordos de equivalência e via abreviada. Na Colômbia e no Peru, os certificados estrangeiros são exigidos ou aceitos como evidência, mas a autoridade avalia o dossiê completo; na Colômbia, o Decreto 3275 de 2009 homologa alguns documentos de produtos de países de referência. No Chile, o ISP faz revisão documental contra normas técnicas, sem ensaios locais. Para a Argentina, o RTM permite simplificar Classe I e II, o que não é reliance. E fiquem de olho na Colômbia: o projeto de decreto único cria uma análise otimizada para alto e muito alto risco e coloca a ANVISA na lista de autoridades de referência, ao lado de FDA, TGA, Health Canada e PMDA.\nMaterial do aluno: Apostila do Aluno, seção 1.5, Reliance.\nFontes: Página COFEPRIS Listados de Registros de DM (guia RELIANCE); Decreto 4725/2005 art. 29 b e página INVIMA (Decreto 3275/2009); Decreto Exento 25/2026 arts. 2º e 7º e nota do ISP; Res. GMC 25/21 Parte 3 item 13; Proyecto de Decreto Régimen Sanitario de DM (Colômbia, dez/2025), arts. 79 a 81.", "refs": [], "notaRefs": ["mercosur", "invima", "minsalud", "bcn"], "ex": []}, {"bg": "background:#FFFFFF", "html": "<div class=\"pe tx\" style=\"left:5.000%;top:5.694%;width:90.000%;min-height:3.056%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.250cqw;letter-spacing:0.278cqw;color:#4A6CF7;font-weight:600\">BLOCO 1.5: RELIANCE</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:10.000%;width:90.000%;min-height:6.944%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:3.047cqw;color:#011072;font-weight:700\">México: a via abreviada</span></p></div><di . Para dispositivos médicos, a COFEPRIS reconhece as decisões dos países do Management Committee do IMDRF, e usa os membros plenos do MDSAP para os certificados de boas práticas. O prazo de resolução é de até 30 dias úteis, pelo trâmite COFEPRIS-04-050, que hoje só aceita protocolo físico. E o produto precisa ter características básicas essenciais idênticas às autorizadas pela autoridade de referência. Os acordos de equivalência de 2010 com FDA e Health Canada e de 2012 com o Japão continuam valendo.\nMaterial do aluno: Apostila do Aluno, seção 1.5, Reliance.\nFontes: Acuerdo DOF 18/07/2025, Transitorio Primero e arts. 4, 16, 18, 20, 24, 26 e 38; Guía de Requisitos Vía Regulatoria Abreviada (COFEPRIS, 12/06/2026), pp. 4-9 e 39; apresentação RELIANCE COFEPRIS 12/06/2026.", "refs": [], "notaRefs": ["cofepris", "dof"], "ex": []}, {"bg": "background:#FFFFFF", "html": "<div class=\"pe tx\" style=\"left:5.000%;top:5.694%;width:90.000%;min-height:3.056%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.250cqw;letter-spacing:0.278cqw;color:#4A6CF7;font-weight:600\">BLOCO 1.5: RELIANCE</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:10.000%;width:90.000%;min-height:6.944%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:3.047cqw;color:#011072;font-weight:700\">O Brasil está na lista</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:86.239%;width:90.000%;min-height:4.733%;background:transparent;padding:0;justify-content:flex-start;color:#171717;\"><p style=\"\"><span style=\"font-size:1.109cqw;color:#6E7480;font-weight:400\">Fonte: <a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, arts. 16, 18, 20 e 24; apresentação RELIANCE COFEPRIS 12/06/2026 (Brasil entre os membros do Management Committee do <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a>)</span></p></div><div class=\"pe tx\" style=\"left:5.000%;top:92.500 const EXERCICIOS=[{"id": "E1", "bloco": "BLOCO 1.1: AUTORIDADES", "titulo": "Qual mudança pesa mais no portfólio", "modo": "Turma, 5 min", "deck": "Slide 8", "cenario": "Pense no seu portfólio ou no de um cliente que hoje exporta do Brasil para a região. Três mudanças recentes estão na mesa: a lista chilena (Decreto Exento 25/2026), a nova base argentina (Disp. ANMAT 64/2025 e 4446/2025) e o regime colombiano em construção.", "perguntas": [{"p": "Qual das três mudanças pesa mais no portfólio que você escolheu? Dê um exemplo concreto.", "r": "Não há resposta única: depende do portfólio. Pontos de referência para a discussão: a lista chilena pesa para quem tem produto entre os 39 itens do Decreto Exento 25/2026, com prazo de 24 ou 36 meses contados de 19/03/2026; a nova base argentina pesa para quem ainda trabalha com a Disp. 2318/02, revogada pela Disp. ANMAT 64/2025; o regime colombiano ainda é projeto e só entra em vigor 18 meses depois de publicado, então hoje vale o Decreto 4725/2005."}, {"p": "Que norma você abriria para confirmar o impacto?", "r": "Chile: Decreto Exento 25/2026, art. 1º e arts. 1º a 3º transitórios. Argentina: Disp. ANMAT 64/2025, arts. 1º a 3º, e Disp. ANMAT 4446/2025, art. 1º. Colômbia: Proyecto de Decreto Régimen Sanitario de DM, arts. 45 e 177, lido como projeto, não como regra vigente."}], "fonte": "Fonte: Decreto Exento 25/2026, art. 1º e arts. 1º a 3º transitórios; Disp. ANMAT 64/2025, arts. 1º a 3º; Disp. ANMAT 4446/2025, art. 1º; Proyecto de Decreto Régimen Sanitario de DM, MinSalud, arts. 45 e 177", "slides": [8], "parte": 1}, {"id": "E2", "bloco": "BLOCO 1.2: CLASSIFICAÇÃO", "titulo": "Classifique o estudo de caso", "modo": "Duplas, 5 min", "deck": "Slide 14", "cenario": "Equipamento eletromédico com software embarcado, Classe III no Brasil. Estime a classe provável em cada país e diga qual regra usou. Para o Chile, responda primeiro se o produto aparece entre os 39 itens do Decreto Exento 25/2026. A resposta final será validada no Módulo 2, com a norma aberta.", "perguntas": [{"p": "Argentina: classe provável e regra.", "r": "Classe III provável. A Argentina usa as mesmas 22 regras da RDC 751/2022 (Res. GMC 25/21, Parte 2 e Ap. II), então a classificação feita para a ANVISA é o ponto de partida direto."}, {"p": "México: classe provável e critério.", "r": "Classe II ou III, pelo critério do art. 83 do RIS: grau de conhecimento do produto na prática médica e tempo no organismo. A partir da Classe II, a Guía COFEPRIS pede biocompatibilidade e estudos clínicos."}, {"p": "Colômbia: classe provável e o que acontece com o software.", "r": "IIb ou III, conforme a regra aplicada (o slide 9 mostra que um Classe III brasileiro pode cair em IIb na Colômbia). O software embarcado herda a classe do equipamento que controla (Decreto 4725/2005, art. 6 b). IIb e III seguem registro com avaliação (art. 16)."}, {"p": "Peru: classe provável e regra.", "r": "Classe III provável, pelas regras 9 (ativo terapêutico) ou 10 (ativo de diagnóstico) do Anexo 1 do DS 003-2020-SA, como ventilador pulmonar, gerador eletrocirúrgico e monitor de UTI."}, {"p": "Chile: o produto está na lista? O que isso muda?", "r": "Primeiro se confere o produto contra os 39 itens do Decreto Exento 25/2026 (art. 1º). Se não estiver na lista, o registro no ISP não é obrigatório, porque a aplicação do DS 825 é progressiva, por decreto (art. 22). Se estiver, a classe do DS 825 define os requisitos (art. 21) e o prazo é de 24 ou 36 meses."}], "fonte": "Fonte: RDC 751/2022, Anexo I; Res. GMC 25/21, Parte 2; RIS, art. 83; Decreto 4725/2005, arts. 6 b e 16; DS 003-2020-SA, Anexo 1, regras 9 e 10; Decreto Exento 25/2026, art. 1º; DS 825/1998, arts. 21 e 22", "slides": [14], "parte": 1}, {"id": "E3", "bloco": "BLOCO 1.3: TITULAR", "titulo": "Titular independente do distribuidor", "modo": "Turma, 5 min", "deck": "Slide 17", "cenario": "Quando o titular do registro é também o distribuidor, trocar de distribuidor pode significar perder o registro. Discuta em quais países é possível separar esses papéis.", "perguntas": [{"p": "Em quais países você manteria o titular independente do distribuidor? Por quê?", "r": "Ponto de partida: a Colômbia, onde o registro já traz titular, fabricante e importador separados (Decreto 4725/2005, arts. 10 e 20). No Peru, só laboratório ou droguería autorizada pode pedir o registro (DS 016-2011-SA, art. 8), o que restringe a escolha do titular. No México, trocar de titular exige cessão notificada em até 30 dias úteis (RIS, art. 190; homoclave COFEPRIS-2022-022-003)."}, {"p": "O que o contrato com o titular precisa prever?", "r": "A transferência do registro se a relação terminar, além do que o titular assume: habilitação vigente, resposta às exigências no prazo, tecnovigilância e ações de campo, e a carta do fabricante que o faculta (slide 16)."}], "fonte": "Fonte: Decreto 4725/2005, arts. 10 e 20; RIS, art. 190, e Guía de Modificaciones COFEPRIS, homoclave COFEPRIS-2022-022-003; DS 016-2011-SA, art. 8", "slides": [17], "parte": 1}, {"id": "E4", "bloco": "PRÁTICA COM IA", "titulo": "Monte e audite o primeiro mapa com IA", "modo": "Individual, 20 min", "deck": "Slides 29 e 30", "cenario": "Passo 1 (10 min): rode o prompt abaixo na ferramenta de IA que você usa hoje, sem incluir dados confidenciais de cliente. Passo 2 (10 min): audite cada célula da resposta contra as normas do módulo e classifique como confirmada, incorreta ou sem fonte.\n\nPrompt: Você é especialista em assuntos regulatórios de dispositivos médicos. Produto: equipamento eletromédico com software embarcado, Classe III na ANVISA (RDC 751/2022), com certificado MDSAP e aprovação FDA. Para México, Argentina, Colômbia, Peru e Chile, monte uma tabela com as colunas: (1) autoridade e marco legal vigente; (2) norma de classificação, regra e classe provável; (3) quem pode ser titular do registro; (4) rota de reliance disponível e tipo (reliance, reconhecimento ou aproveitamento de evidência). Em cada célula, cite a norma e o artigo. Se não tiver certeza, escreva \"não sei\" e indique a fonte oficial onde conferir. Não invente número de norma, artigo ou prazo.", "perguntas": [{"p": "Resumo da resposta da IA por país (autoridade, classe, titular e rota).", "r": "Não há resposta fixa: cada ferramenta responde de um jeito. O que vale é a auditoria do passo 2, comparando cada célula com as fontes dos slides 4 a 26."}, {"p": "Placar da auditoria: quantas células confirmadas, incorretas e sem fonte?", "r": "Registre os três números. Célula sem norma ou sem artigo conta como sem fonte, mesmo que o conteúdo pareça certo: pela regra do curso, sem artigo, não entra."}, {"p": "A IA citou norma revogada ou ignorou alguma atualização? Qual?", "r": "Erros a procurar: Disp. ANMAT 2318/02 e 1285/04, revogadas pela Disp. ANMAT 64/2025 (art. 3º); Res. GMC 40/00, revogada pela Res. GMC 25/21 (art. 4); lista chilena sem o Decreto Exento 25/2026; Colômbia tratada pelo projeto de decreto como se já estivesse vigente."}], "fonte": "Fonte: Disp. ANMAT 64/2025, art. 3º; Res. GMC 25/21, art. 4; Decreto Exento 25/2026; normas do Módulo 1 (slides 4 a 26)", "slides": [29, 30], "parte": 1}, {"id": "E5", "bloco": "PRÁTICA COM IA", "titulo": "Que erro teria gerado exigência ou indeferimento", "modo": "Turma, 5 min", "deck": "Slide 31", "cenario": "Volte à auditoria do E4. Se a resposta da IA tivesse ido direto para o dossiê, que consequência cada erro teria?", "perguntas": [{"p": "Qual erro encontrado teria gerado exigência?", "r": "Classe errada, documento faltando ou norma revogada: a autoridade pede complementação. Na Colômbia, por exemplo, o solicitante tem 90 dias para complementar (Decreto 4725/2005, art. 21 c)."}, {"p": "Qual erro teria levado a indeferimento?", "r": "Rota inexistente ou titular não habilitado: o pedido não se sustenta. Guarde o exemplo: ele abre a governança de uso de IA no Módulo 4."}], "fonte": "Fonte: Decreto 4725/2005, arts. 21 c e 22; RDC 751/2022, art. 38", "slides": [31], "parte": 1}];

/* HSC Academy - núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} - ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} - ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;
      if(a[q]===o.dataset.o) mark(q,o.dataset.o);
      o.onclick=()=>{ if(feedback&&ans()[q]) return; const s=ans(); s[q]=o.dataset.o; store.set("doc",s); mark(q,o.dataset.o); onChange&&onChange(); }; });
  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,linkify,refCard,store,toast,exerciseHTML,wireExercise}=HSC;
  const PROF=CONFIG.modo==="professor";
  let cur=0, sideOpen=false, sideTab=PROF?"notas":"anot";
  if(!HSC.boot(onKey)) return;

  $("#logo").src=ASSETS.logoWhite;
  $("#courseName").textContent=CONFIG.curso+" - "+CONFIG.parte;
  $("#badge").textContent=PROF?"Uso exclusivo do instrutor":"Material do aluno";
  $("#badge").className="badge "+(PROF?"prof":"alu");
  $("#btnSide").textContent=PROF?"Notas":"Anotações";
  $("#code").textContent=CONFIG.codigo;
  if(!PROF) $("#btnTimer").style.display="none";
  const TABS=PROF?[["notas","Notas do orador"],["ex","Exercícios"],["refs","Fontes"]]:[["anot","Minhas anotações"],["ex","Exercícios"],["refs","Fontes"]];
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}">${l}</button>`).join("");
  $("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]"); if(b){ sideTab=b.dataset.tab; renderSide(); }};

  /* slides em HTML nativo (convertidos do .pptx do professor) */
  const stage=$("#stage"), vp=$("#vp");
  const fit=()=>vp.style.setProperty("--k",stage.clientWidth/1280); addEventListener("resize",fit); new ResizeObserver(fit).observe(stage);
  function fillImgs(root){ root.querySelectorAll("img[data-img]").forEach(i=>{ if(!i.src) i.src=IMGS[i.dataset.img]; }); root.querySelectorAll("[data-bgimg]").forEach(d=>{ d.style.backgroundImage=`linear-gradient(180deg,rgba(0,11,74,.75) 0%,rgba(0,11,74,0) 26%,rgba(0,11,74,0) 72%,rgba(0,11,74,.8) 100%),url(${IMGS[d.dataset.bgimg]})`; }); }
  function slideEl(s){ const el=document.createElement("section"); el.className="slide";
    if(s.bg&&s.bg.startsWith("__BG__")) el.style.backgroundImage=`url(${IMGS[s.bg.slice(6)]})`; else if(s.bg) el.style.cssText+=";"+s.bg;
    el.innerHTML=s.html; return el; }
  const els=SLIDES.map((s,i)=>{
    const el=slideEl(s);
    if(s.ex&&s.ex.length){ const w=document.createElement("div"); w.className="exchips";
      w.innerHTML=s.ex.map(id=>{const e=EXERCICIOS.find(x=>x.id===id); return `<button class="exchip" data-ex="${id}"><i>${id}</i>${PROF?"Exercício":"Fazer o exercício"} <span class="ic ic-hora"></span> ${esc(e.modo.split(",").pop().trim())}</button>`}).join("");
      el.appendChild(w); }
    // identificação discreta no rodapé do próprio slide (aparece em print recortado só do slide)
    const sw=document.createElement("div"); sw.className="swm"+((s.bg||"").startsWith("__BG__")?" dk":""); el.appendChild(sw);
    vp.appendChild(el); return el;
  });
  let seen=new Set(store.get("seen",[]));
  function go(i){
    cur=Math.max(0,Math.min(SLIDES.length-1,i));
    els.forEach((el,k)=>{ el.classList.toggle("active",k===cur); if(Math.abs(k-cur)<=1&&!el._f){ fillImgs(el); el._f=true; } });
    $("#count").textContent=(cur+1)+" / "+SLIDES.length;
    $("#bar").style.width=((cur+1)/SLIDES.length*100)+"%";
    if(!PROF){ seen.add(cur); store.set("seen",[...seen]); $("#seenbar").style.width=(seen.size/SLIDES.length*100)+"%";
      if(seen.size===SLIDES.length&&!store.get("done",false)){ store.set("done",true); toast("Você percorreu todos os slides desta parte."); } }
    try{ history.replaceState(null,"","#"+(cur+1)); }catch(e){}
    if(sideOpen) renderSide();
    if($("#grid").classList.contains("open")) markGrid();
  }

  /* exercícios */
  function openEx(id){ const ex=EXERCICIOS.find(x=>x.id===id); if(!ex) return;
    if(ex.html){ $("#exBody").innerHTML=`<div class="docx">${ex.html}</div>`+(PROF?"":`<p class="saveinfo">Suas respostas ficam salvas neste navegador e aparecem também no Caderno de Exercícios.</p>`); HSC.wireDoc($("#exBody"),CONFIG.modo,false,null,DOCIMGS); }
    else { $("#exBody").innerHTML=exerciseHTML(ex,CONFIG.modo); wireExercise($("#exBody"),ex); }
    $("#exModal").classList.add("open"); }
  document.addEventListener("click",e=>{ const b=e.target.closest("[data-ex]"); if(b){ e.preventDefault(); openEx(b.dataset.ex); } });

  /* painel lateral */
  function renderSide(){
    [...$("#tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.tab===sideTab));
    const b=$("#sideBody"), s=SLIDES[cur];
    const ids=[...new Set((s.hot||[]).flatMap(h=>h.refs).concat(s.notaRefs||[]))];
    if(sideTab==="notas"){
      const notes=(s.notas||"").split(/\n+/).filter(Boolean).map(p=>`<p>${linkify(p)}</p>`).join("")||"<p style='opacity:.6'>Sem notas para este slide.</p>";
      b.innerHTML=`<h4>Slide ${cur+1} - notas do orador</h4>${notes}`+
        ((s.ex||[]).length?`<h4>Exercício neste slide</h4>`+s.ex.map(exItem).join(""):"")+
        (ids.length?"<h4>Fontes deste slide</h4>"+ids.map(id=>refCard(id)).join(""):"");
    } else if(sideTab==="anot"){
      const all=store.get("anot",{});
      b.innerHTML=`<h4>Slide ${cur+1} - minhas anotações</h4><textarea id="anot" placeholder="Anote aqui o que quiser lembrar deste slide. Fica salvo neste navegador.">${esc(all[cur]||"")}</textarea>
        <p style="font-size:12px;opacity:.65;margin-top:6px" id="anotSv">${all[cur]?"Salvo":""}</p>`+
        ((s.ex||[]).length?`<h4>Exercício neste slide</h4>`+s.ex.map(exItem).join(""):"")+
        (ids.length?"<h4>Fontes deste slide</h4>"+ids.map(id=>refCard(id)).join(""):"");
      let t; $("#anot").oninput=e=>{ clearTimeout(t); t=setTimeout(()=>{ const a=store.get("anot",{}); a[cur]=e.target.value; $("#anotSv").textContent=store.set("anot",a)?"Salvo":"Não foi possível salvar neste navegador"; },400); };
    } else if(sideTab==="ex"){
      const list=EXERCICIOS.filter(x=>x.parte===CONFIG.parteN);
      b.innerHTML=`<h4>Exercícios desta parte</h4>`+(list.length?list.map(exItem).join(""):"<p style='opacity:.6'>Nenhum exercício nesta parte.</p>")+
        `<p style="font-size:12.5px;opacity:.7;margin-top:12px">${PROF?"As respostas de referência abrem dentro de cada exercício.":"O Caderno de Exercícios do módulo, com a avaliação objetiva, está na aula seguinte da plataforma."}</p>`;
    } else {
      b.innerHTML=`<input class="filter" id="flt" placeholder="Filtrar (ex.: ANMAT, IMDRF, COFEPRIS)"><div id="lst">${Object.keys(REFS).map(id=>refCard(id)).join("")}</div>`;
      $("#flt").oninput=e=>{const q=e.target.value.toLowerCase();[...$("#lst").children].forEach(c=>c.style.display=c.textContent.toLowerCase().includes(q)?"":"none");};
    }
  }
  function exItem(id){ const e=typeof id==="string"?EXERCICIOS.find(x=>x.id===id):id;
    return `<div class="exitem" data-ex="${e.id}"><b>${e.id}</b><div>${esc(e.titulo)}<small>${esc(e.modo)} - ${esc(e.deck)}</small></div></div>`; }
  function toggleSide(){ sideOpen=!sideOpen; $("#side").classList.toggle("open",sideOpen); $("#wrap").classList.toggle("with-side",sideOpen);
    $("#btnSide").setAttribute("aria-pressed",sideOpen); if(sideOpen) renderSide(); }
  $("#btnSide").onclick=toggleSide;
  function toggleHot(){ const on=stage.classList.toggle("show-hot"); $("#btnHot").setAttribute("aria-pressed",on); }
  $("#btnHot").onclick=toggleHot;

  /* visão geral */
  let built=false;
  function markGrid(){ [...$("#grid").children].forEach((t,i)=>{ t.classList.toggle("cur",i===cur); t.classList.toggle("seen",!PROF&&seen.has(i)); }); }
  function toggleGrid(){ const g=$("#grid");
    if(!built){ SLIDES.forEach((s,i)=>{ const t=document.createElement("div"); t.className="th"; t.dataset.i=i;
        const m=document.createElement("div"); m.className="mini"; const el=slideEl(s); m.appendChild(el); fillImgs(el); t.appendChild(m);
        t.insertAdjacentHTML("beforeend",`<span class="num">${i+1}</span>`); g.appendChild(t); }); built=true; }
    g.classList.toggle("open"); markGrid(); requestAnimationFrame(()=>[...g.children].forEach(t=>t.style.setProperty("--s",t.clientWidth/1000))); }
  $("#grid").onclick=e=>{ const t=e.target.closest(".th"); if(t){ go(+t.dataset.i); $("#grid").classList.remove("open"); } };
  $("#btnGrid").onclick=toggleGrid;

  let t0=null,acc=0,tick=null;
  const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
  function toggleTimer(){ if(tick){acc+=Date.now()-t0;clearInterval(tick);tick=null}else{t0=Date.now();tick=setInterval(()=>$("#timer").textContent=fmt(acc+Date.now()-t0),500)} }
  $("#btnTimer").onclick=toggleTimer;
  function fs(){ const d=document.documentElement; if(!document.fullscreenElement){ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); } else document.exitFullscreen(); }
  $("#btnFs").onclick=fs;
  $("#prev").onclick=()=>go(cur-1); $("#next").onclick=()=>go(cur+1);
  let tx=null; stage.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
  stage.addEventListener("touchend",e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) go(cur+(dx<0?1:-1)); tx=null; });

  function onKey(e,k){
    if(document.querySelector(".modal.open")) return;
    if(k==="arrowright"||k==="pagedown"||k===" "){e.preventDefault();go(cur+1)}
    else if(k==="arrowleft"||k==="pageup"){e.preventDefault();go(cur-1)}
    else if(k==="home")go(0); else if(k==="end")go(SLIDES.length-1);
    else if(k==="n")toggleSide(); else if(k==="h")toggleHot(); else if(k==="g")toggleGrid();
    else if(k==="f")fs(); else if(k==="t"&&PROF)toggleTimer();
  }
  const h=parseInt((location.hash||"").slice(1)); go(isNaN(h)?0:h-1);
})();
</script>
